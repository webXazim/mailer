# Only cloudflared and trusted VPS users can reach this listener. The API and
# nginx share a network namespace so the API's loopback-only proxy trust works.
map $http_cf_connecting_ip $mailer_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 36000000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://connect.crescentsphere.com https://docs.crescentsphere.com https://mail.crescentsphere.com https://mailer.crescentsphere.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /internal { return 404; }
  location ^~ /internal/ { return 404; }
  location = /api/internal { return 404; }
  location ^~ /api/internal/ { return 404; }
  location = /operator { return 404; }
  location ^~ /operator/ { return 404; }
  location = /api/operator { return 404; }
  location ^~ /api/operator/ { return 404; }

  # Console and SDKs share /api; strip the prefix before Axum.
  location /api/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mailer_client_ip;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-SMTP-Gateway-Secret "";
    proxy_set_header X-SMTP-Client-IP "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Docker publishes this listener only on the VPS loopback interface.
server {
  listen 8082;
  server_name localhost;
  server_tokens off;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

  location = / { return 302 /operator/; }
  location = /operator { return 302 /operator/; }
  location ^~ /operator/ {
    if ($host != localhost) { return 404; }
    proxy_pass http://127.0.0.1:8080;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Content-Security-Policy;
    proxy_set_header Host localhost:18085;
    proxy_set_header X-Real-IP 127.0.0.1;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Mailer-Operator-Local "1";
    proxy_set_header Connection "";
  }
  location / { return 404; }
}
